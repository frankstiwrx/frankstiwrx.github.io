<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burger.IO | Detalhes</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <!--ARQUIVO CSS PARA UTILIZAÇÃO DE ICONES-->
    <link rel="stylesheet" href="styles.css" />
    <!--ARQUIVO CSS COM NOSSOS ESTILOS-->
  </head>
  <body>
    <header class="header-details">
      <img src="assets/x-bacon.jpg" alt="X-Bacon" class="image-iten" />

      <div class="option-details">
        <a href="index.html">
          <div class="icon-option">
            <i class="bx bx-chevron-left"></i>
          </div>
        </a>

        <div class="right-option">
          <div class="icon-option">
            <i class="bx bx-search-alt-2"></i>
          </div>

          <div class="icon-option">
            <i class="bx bx-heart"></i>
          </div>
        </div>
      </div>
    </header>
    <!--header-details-->

    <main class="main-details">
      <h1 class="name-iten">X-Bacon</h1>

      <section class="info-details">
        <div class="iten-raiting">
          <i class="bx bxs-star"></i>
          <i class="bx bxs-star"></i>
          <i class="bx bxs-star"></i>
          <i class="bx bxs-star"></i>
          <i class="bx bxs-star-half"></i>
          <p>4.5 (2.5k)</p>
        </div>

        <div class="description-details">
          Um burger caprichado, preparado com ingredientes selecionados, pão
          macio e aquele sabor clássico de lanchonete. Confira as opções do
          cardápio e escolha o seu favorito.
        </div>

        <div class="galery-details">
          <a class="galery-image" href="#image01">
            <img src="assets/x-bacon.jpg" alt="X-Bacon" />
          </a>

          <a href="#" class="lightbox" id="image01">
            <span style="background-image: url(assets/x-bacon.jpg)">
              <p>Conheça também nosso Bacon House</p>
            </span>
          </a>

          <a class="galery-image" href="#image02">
            <img src="assets/x-salada.jpg" alt="X-Salada" />
          </a>

          <a href="#" class="lightbox" id="image02">
            <span style="background-image: url(assets/x-salada.jpg)">
              <p>Conheça também nosso Fresh Burger</p>
            </span>
          </a>
        </div>

        <div class="buy-iten">
          <p class="price-iten">R$ 12.90</p>

          <a onclick="openOrderConfirm()" class="option-detail"
            >Adicionar ao pedido</a
          >
        </div>
      </section>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);

      const itemName = urlParams.get("name");
      const itemPrice = urlParams.get("price");
      const itemImage = urlParams.get("image");

      const imageDetail = document.querySelector(".image-iten");
      const nameDetail = document.querySelector(".name-iten");
      const priceDetail = document.querySelector(".price-iten");

      nameDetail.textContent = itemName;
      priceDetail.textContent = "R$" + itemPrice;
      imageDetail.src = "assets/" + itemImage;

      function openOrderConfirm() {
        window.open(
          "confirm_order.html?name=" +
            itemName +
            "&price=" +
            itemPrice +
            "&image=" +
            itemImage,
          "_self",
        );
      }
    </script>
  </body>
</html>
